[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall-sim"
version = "0.1.0"
description = "Pure, batched, seed-deterministic race strategy simulation engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]
model = [
    "pandas>=2.0",
    "pyarrow>=14",
    "fastf1>=3.3",
    "scipy>=1.11",
]
model-train = [
    "pitwall-sim[model]",
    "pymc>=5.0",
    "arviz>=0.18",
]

[project.scripts]
pitwall-race = "pitwall_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
