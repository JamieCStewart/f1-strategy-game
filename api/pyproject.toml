[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall-api"
version = "0.3.0"
description = "FastAPI race-room server for Pit Wall"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    # pitwall-sim is a local package — install first: cd sim && pip install -e .
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pitwall-server = "pitwall_api.app:main"

[tool.setuptools.packages.find]
where = ["src"]
